name: Build Little Shop of Horrors

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Platform to build (leave empty for default Windows + WebGL)'
        required: false
        default: ''
      development_build:
        description: 'Development build? (true/false)'
        required: false
        default: 'false'

# Cancel in-progress runs for the same branch/PR to save free-tier minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.62f1

jobs:
  # ── Pre-flight: verify license secret exists before spinning up paid runners ─
  check:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check_license.outputs.has_license }}
    steps:
      - name: Check UNITY_LICENSE secret
        id: check_license
        run: |
          if [ -n "${{ secrets.UNITY_LICENSE }}" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::UNITY_LICENSE secret is not set. Build jobs will be skipped."
            echo "::warning::See README for instructions on obtaining a Unity license file."
            echo "has_license=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Windows Build ─────────────────────────────────────────────────────────────
  build-windows:
    name: Build / Windows (StandaloneWindows64)
    runs-on: ubuntu-latest
    needs: check
    if: >-
      needs.check.outputs.has_license == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.build_target == '' ||
       github.event.inputs.build_target == 'StandaloneWindows64')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-
            Library-

      - name: Build (Windows)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: FeedMe.Editor.BuildScript.BuildGame
          buildName: LittleShopOfHorrors
          buildsPath: Builds
          customParameters: >-
            -buildTarget StandaloneWindows64
            -buildMode ${{ github.event.inputs.development_build == 'true' && 'Development' || 'Release' }}

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows-${{ github.run_number }}
          path: Builds/Windows/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
          if-no-files-found: error

  # ── WebGL Build ───────────────────────────────────────────────────────────────
  build-webgl:
    name: Build / WebGL
    runs-on: ubuntu-latest
    needs: check
    if: >-
      needs.check.outputs.has_license == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       github.event.inputs.build_target == '' ||
       github.event.inputs.build_target == 'WebGL')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build (WebGL)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: FeedMe.Editor.BuildScript.BuildGame
          buildName: LittleShopOfHorrors
          buildsPath: Builds
          customParameters: >-
            -buildTarget WebGL
            -buildMode ${{ github.event.inputs.development_build == 'true' && 'Development' || 'Release' }}

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL-${{ github.run_number }}
          path: Builds/WebGL/
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 7 }}
          if-no-files-found: error

  # ── macOS Build (manual trigger only — macOS runners cost 10x free-tier minutes)
  build-macos:
    name: Build / macOS
    runs-on: ubuntu-latest
    needs: check
    if: >-
      needs.check.outputs.has_license == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.build_target == 'StandaloneOSX' ||
       github.event.inputs.build_target == 'macos')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-macOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-macOS-
            Library-

      - name: Build (macOS)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneOSX
          buildMethod: FeedMe.Editor.BuildScript.BuildGame
          buildName: LittleShopOfHorrors
          buildsPath: Builds
          customParameters: >-
            -buildTarget StandaloneOSX
            -buildMode ${{ github.event.inputs.development_build == 'true' && 'Development' || 'Release' }}

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-macOS-${{ github.run_number }}
          path: Builds/macOS/
          retention-days: 14
          if-no-files-found: error

  # ── Linux Build (manual trigger only) ─────────────────────────────────────────
  build-linux:
    name: Build / Linux (StandaloneLinux64)
    runs-on: ubuntu-latest
    needs: check
    if: >-
      needs.check.outputs.has_license == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.build_target == 'StandaloneLinux64' ||
       github.event.inputs.build_target == 'linux')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Linux-
            Library-

      - name: Build (Linux)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: FeedMe.Editor.BuildScript.BuildGame
          buildName: LittleShopOfHorrors
          buildsPath: Builds
          customParameters: >-
            -buildTarget StandaloneLinux64
            -buildMode ${{ github.event.inputs.development_build == 'true' && 'Development' || 'Release' }}

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-Linux-${{ github.run_number }}
          path: Builds/Linux/
          retention-days: 14
          if-no-files-found: error
